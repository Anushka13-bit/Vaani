android.useAndroidX=true
android.enableJetifier=true
FLIPPER_VERSION=0.212.0
reactNativeArchitectures=arm64-v8a
newArchEnabled=false
hermesEnabled=true

# JVM / build performance
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
# org.gradle.java.home was previously hardcoded to a macOS-only Temurin 21 path
# (/Library/Java/...), which broke the build on every other OS outright — Gradle
# treats an invalid org.gradle.java.home as fatal and it overrides JAVA_HOME, so
# there was no way to build on Windows/Linux without editing this file locally.
# Left unset so Gradle uses the JAVA_HOME already on each developer's machine
# (Java 17 on Windows; a JDK 17-21 toolchain elsewhere both work with AGP/Gradle 8.6).
