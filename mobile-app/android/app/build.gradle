apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    /* Folders */
    // root = file("../")
    // reactNativeDir = file("../node_modules/react-native")
    // codegenDir = file("../node_modules/@react-native/codegen")
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    // nodeExecutableAndArgs = ["node"]
    // bundleCommand = "ram-bundle"
    // bundleConfig = file(../rn-cli.config.js)
    // bundleAssetName = "MyApplication.android.bundle"
    // entryFile = file("../js/MyApplication.android.js")
    // extraPackagerArgs = []

    /* Hermes Commands */
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * Enable Hermes JavaScript engine.
 */
def hermesEnabled = true

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.vaanimitra"

    defaultConfig {
        applicationId "com.vaanimitra"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    // The sherpa-onnx AAR bundles its own libonnxruntime.so per ABI (jni/<abi>/*.so).
    // This was NOT hypothetical: xyz.rementia:openwakeword transitively depends on
    // com.microsoft.onnxruntime:onnxruntime-android:1.18.0, which ALSO ships a
    // libonnxruntime.so — and the two are binary-incompatible despite sharing a
    // filename. Each requires an exact ELF symbol-version tag matching its own
    // release (verified via `llvm-readobj --version-info`): openWakeWord's JNI hard-
    // requires "libonnxruntime.so" version "VERS_1.18.0", sherpa-onnx's JNI hard-
    // requires "VERS_1.28.2". Neither file can satisfy the other's requirement, so
    // only one "libonnxruntime.so" can exist in the merged APK and it must be
    // sherpa's (pickFirsts below) — but that leaves openWakeWord's JNI unable to
    // resolve at dlopen time (`UnsatisfiedLinkError: cannot locate symbol
    // OrtGetApiBase`), crashing the whole app the moment the wake-word service
    // starts.
    //
    // Fix: app/src/main/jniLibs/arm64-v8a/ ships two extra files, generated once
    // (not by this build) and checked in:
    //   - libonnxruntimf.so — a byte-identical copy of the official onnxruntime-
    //     android:1.18.0 libonnxruntime.so, renamed (one character) so it can't
    //     collide with sherpa's copy of the real name.
    //   - libonnxruntime4j_jni.so — openWakeWord's own JNI glue, with its single
    //     DT_NEEDED entry ("libonnxruntime.so") byte-patched to the renamed name
    //     above. Same length, same offset semantics — nothing else in the ELF
    //     structure changes. pickFirsts must prefer this project-provided copy
    //     over the unmodified one bundled inside openwakeword's own AAR.
    // See docs/SHERPA_ONNX_CONTRACT.md for how this was diagnosed and regenerated.
    packagingOptions {
        jniLibs {
            pickFirsts += [
                "lib/arm64-v8a/libonnxruntime.so",
                "lib/armeabi-v7a/libonnxruntime.so",
                "lib/x86/libonnxruntime.so",
                "lib/x86_64/libonnxruntime.so",
                "lib/arm64-v8a/libsherpa-onnx-jni.so",
                "lib/arm64-v8a/libsherpa-onnx-c-api.so",
                "lib/arm64-v8a/libsherpa-onnx-cxx-api.so",
                "lib/arm64-v8a/libonnxruntime4j_jni.so",
            ]
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // On-device Whisper STT via sherpa-onnx (k2-fsa/sherpa-onnx, Apache 2.0).
    // No Maven artifact is published — this is a prebuilt AAR pulled from the
    // project's GitHub Releases (see docs/SHERPA_ONNX_CONTRACT.md for how it was
    // fetched and why this tag was pinned). It bundles its own onnxruntime native
    // libs, so the old direct onnxruntime-android dependency is gone.
    implementation(files("libs/sherpa-onnx-1.13.8.aar"))

    // openWakeWord
    implementation("xyz.rementia:openwakeword:0.1.5")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
